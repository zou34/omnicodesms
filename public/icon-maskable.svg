<!-- "maskable" purpose: Android crops adaptive icons to a circle/squircle,
     discarding roughly the outer 20%. Background fills the full canvas
     (no transparent corners after cropping) and the glyph sits within the
     safe zone so it survives the crop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)" />
  <rect x="216" y="176" width="80" height="180" rx="18" fill="white" />
</svg>
